<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鲸鱼女仆娘骑自行车 🐳🚲</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #1b2436;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  .stage {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    max-height: 675px;
    display: block;
  }

  /* ---------- 动画 ---------- */
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes tailSway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
  @keyframes hairSway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes skirtSway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pedal { to { transform: rotate(-360deg); } }
  @keyframes cloudMove { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
  @keyframes seagull { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-14px); } }
  @keyframes wave { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
  @keyframes sparkle { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .bike-group { animation: bob 1.8s ease-in-out infinite; }
  .whale-tail { animation: tailSway 1.4s ease-in-out infinite; transform-origin: 690px 330px; }
  .hair-back { animation: hairSway 1.9s ease-in-out infinite; transform-origin: 850px 200px; }
  .skirt-flow { animation: skirtSway 1.5s ease-in-out infinite; transform-origin: 730px 340px; }
  .wheel-rear, .wheel-front { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
  .spokes-rear, .spokes-front { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
  .pedals { transform-box: fill-box; transform-origin: center; animation: pedal 1.4s linear infinite; }
  .cloud { animation: cloudMove 40s linear infinite; }
  .cloud.c2 { animation-duration: 55s; animation-delay: -20s; }
  .cloud.c3 { animation-duration: 48s; animation-delay: -34s; }
  .gull { animation: seagull 6s ease-in-out infinite; }
  .gull.g2 { animation-delay: 2s; }
  .wave { animation: wave 3.5s ease-in-out infinite; }
  .sparkle { animation: sparkle 2.5s ease-in-out infinite; }

  footer {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    z-index: 2;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stage">
  <svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="蓝发鲸鱼女仆娘在海边骑自行车">

  <script>
    const stage = document.querySelector('.stage');
    const wheels = document.querySelectorAll('.wheel-rear, .wheel-front, .spokes-rear, .spokes-front, .pedals');
    let fast = false;
    function setSpeed(v) {
      wheels.forEach(el => { el.style.animationDuration = v; });
    }
    stage.addEventListener('click', () => {
      fast = !fast;
      setSpeed(fast ? '0.35s' : '1.4s');
      document.title = fast ? '冲鸭！鲸鱼娘！🐳💨' : '鲸鱼女仆娘骑自行车 🐳🚲';
    });
