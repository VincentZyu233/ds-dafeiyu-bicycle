<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大肥鱼猫娘骑自行车 🐟🚲</title>
<style>
  :root {
    --sky-top: #7ec8ff;
    --sky-bottom: #dff3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }
  header {
    text-align: center;
    padding: 18px 16px 4px;
    position: relative;
    z-index: 2;
  }
  header h1 {
    font-size: clamp(26px, 6vw, 50px);
    color: #fff;
    text-shadow: 0 3px 0 #1e7fd0, 0 6px 14px rgba(0,0,0,0.25);
    letter-spacing: 2px;
  }
  header p {
    margin-top: 6px;
    font-size: clamp(13px, 2.4vw, 17px);
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    opacity: 0.95;
  }
  .stage {
    flex: 1;
    width: 100%;
    max-width: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    position: relative;
    z-index: 1;
  }
  svg { width: 100%; height: auto; max-height: 72vh; }

  /* ---------- 动画 ---------- */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes tailSway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(6deg); }
  }
  @keyframes earWig {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pedal {
    to { transform: rotate(-360deg); }
  }
  @keyframes cloudMove {
    from { transform: translateX(-160px); }
    to { transform: translateX(1100px); }
  }
  @keyframes rayPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @keyframes bubble {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    20% { opacity: 0.9; }
    100% { transform: translateY(-220px) scale(1.15); opacity: 0; }
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.1); }
  }

  .bike-group { animation: bob 1.6s ease-in-out infinite; }
  .twintail-left { animation: tailSway 1.1s ease-in-out infinite; transform-origin: 300px 190px; }
  .twintail-right { animation: tailSway 1.1s ease-in-out infinite; animation-delay: 0.15s; transform-origin: 410px 190px; }
  .ear-left { animation: earWig 0.9s ease-in-out infinite; transform-origin: 332px 128px; }
  .ear-right { animation: earWig 0.9s ease-in-out infinite; animation-delay: 0.2s; transform-origin: 378px 128px; }
  .wheel-rear, .wheel-front { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
  .spokes-rear, .spokes-front { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
  .pedals { transform-box: fill-box; transform-origin: center; animation: pedal 1.2s linear infinite; }
  .cloud { animation: cloudMove 28s linear infinite; }
  .cloud.c2 { animation-duration: 40s; animation-delay: -14s; top: 90px; }
  .cloud.c3 { animation-duration: 34s; animation-delay: -26s; top: 150px; }
  .sun-rays { transform-box: fill-box; transform-origin: center; animation: rayPulse 3s ease-in-out infinite; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  .bubble { animation: bubble 3.4s ease-in infinite; }
  .bubble.b2 { animation-delay: 0.9s; }
  .bubble.b3 { animation-delay: 1.7s; }
  .bubble.b4 { animation-delay: 2.5s; }
  footer {
    padding: 8px 14px 14px;
    font-size: 13px;
    color: #1e6fc0;
    position: relative;
    z-index: 2;
    text-align: center;
    font-weight: 600;
  }
</style>
</head>
<body>
  <header>
    <h1>🐟 大肥鱼猫娘骑自行车 🚲</h1>
    <p>蓝色猫娘 · 一路蹬蹬蹬 · 咕噜咕噜</p>
  </header>

  <div class="stage">
    <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只蓝色猫娘骑着自行车">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fd0ff"/>
          <stop offset="1" stop-color="#e4f6ff"/>
        </linearGradient>
        <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#63bcff"/>
          <stop offset="1" stop-color="#2f8fe8"/>
        </linearGradient>
        <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3f9fe8"/>
          <stop offset="1" stop-color="#1e6fc0"/>
        </linearGradient>
        <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff3b0"/>
          <stop offset="0.7" stop-color="#ffd54f"/>
          <stop offset="1" stop-color="#ffc233"/>
        </radialGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f5ba0" flood-opacity="0.28"/>
        </filter>
      </defs>

      <!-- 天空 -->
      <rect x="0" y="0" width="800" height="520" fill="url(#sky)"/>

      <!-- 太阳 -->
      <g transform="translate(680, 90)">
        <g class="sun-rays">
          <g stroke="#ffd54f" stroke-width="10" stroke-linecap="round">
            <line x1="0" y1="-70" x2="0" y2="-92"/>
            <line x1="0" y1="70" x2="0" y2="92"/>
            <line x1="-70" y1="0" x2="-92" y2="0"/>
            <line x1="70" y1="0" x2="92" y2="0"/>
            <line x1="-50" y1="-50" x2="-65" y2="-65"/>
            <line x1="50" y1="-50" x2="65" y2="-65"/>
            <line x1="-50" y1="50" x2="-65" y2="65"/>
            <line x1="50" y1="50" x2="65" y2="65"/>
          </g>
        </g>
        <circle r="46" fill="url(#sun)"/>
      </g>

      <!-- 云 -->
      <g class="cloud c1" transform="translate(120, 70)">
        <g fill="#ffffff" opacity="0.92">
          <ellipse cx="0" cy="0" rx="42" ry="20"/>
          <ellipse cx="34" cy="-8" rx="30" ry="18"/>
          <ellipse cx="-32" cy="-4" rx="26" ry="16"/>
        </g>
      </g>
      <g class="cloud c2" transform="translate(120, 90)">
        <g fill="#ffffff" opacity="0.85">
          <ellipse cx="0" cy="0" rx="36" ry="17"/>
          <ellipse cx="28" cy="-6" rx="26" ry="14"/>
          <ellipse cx="-26" cy="-3" rx="22" ry="13"/>
        </g>
      </g>
      <g class="cloud c3" transform="translate(120, 150)">
        <g fill="#ffffff" opacity="0.8">
          <ellipse cx="0" cy="0" rx="30" ry="14"/>
          <ellipse cx="24" cy="-5" rx="22" ry="12"/>
        </g>
      </g>

      <!-- 海水 -->
      <rect x="0" y="360" width="800" height="160" fill="#7fd0ff"/>
      <rect x="0" y="360" width="800" height="8" fill="#aee2ff"/>

      <!-- 波纹 -->
      <g stroke="#d8f2ff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
        <path d="M 40 410 q 20 -12 40 0 q 20 12 40 0"/>
        <path d="M 300 430 q 18 -10 36 0 q 18 10 36 0"/>
        <path d="M 600 405 q 22 -12 44 0 q 22 12 44 0"/>
        <path d="M 120 460 q 16 -9 32 0 q 16 9 32 0"/>
        <path d="M 560 455 q 18 -10 36 0 q 18 10 36 0"/>
      </g>

      <!-- 气泡 -->
      <g fill="#eaf8ff" opacity="0.9">
        <circle class="bubble b1" cx="560" cy="330" r="9"/>
        <circle class="bubble b2" cx="580" cy="340" r="6"/>
        <circle class="bubble b3" cx="548" cy="320" r="5"/>
        <circle class="bubble b4" cx="595" cy="335" r="7"/>
      </g>

      <!-- ============ 自行车 + 猫娘 ============ -->
      <g class="bike-group" transform="translate(0, 0)" filter="url(#softShadow)">

        <!-- 后轮 -->
        <g class="wheel-rear" transform="translate(300, 400)">
          <circle r="58" fill="none" stroke="#2b2b33" stroke-width="9"/>
          <circle r="58" fill="none" stroke="#d8d8e0" stroke-width="3"/>
          <g class="spokes-rear" stroke="#5a5a66" stroke-width="2.5">
            <line x1="0" y1="-52" x2="0" y2="52"/>
            <line x1="-52" y1="0" x2="52" y2="0"/>
            <line x1="-37" y1="-37" x2="37" y2="37"/>
            <line x1="37" y1="-37" x2="-37" y2="37"/>
          </g>
          <circle r="7" fill="#2b2b33"/>
        </g>

        <!-- 前轮 -->
        <g class="wheel-front" transform="translate(530, 400)">
          <circle r="58" fill="none" stroke="#2b2b33" stroke-width="9"/>
          <circle r="58" fill="none" stroke="#d8d8e0" stroke-width="3"/>
          <g class="spokes-front" stroke="#5a5a66" stroke-width="2.5">
            <line x1="0" y1="-52" x2="0" y2="52"/>
            <line x1="-52" y1="0" x2="52" y2="0"/>
            <line x1="-37" y1="-37" x2="37" y2="37"/>
            <line x1="37" y1="-37" x2="-37" y2="37"/>
          </g>
          <circle r="7" fill="#2b2b33"/>
        </g>

        <!-- 车架 -->
        <g stroke="#3a4a9c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 300 400 L 400 400"/>
          <path d="M 400 400 L 340 330"/>
          <path d="M 340 330 L 300 400"/>
          <path d="M 400 400 L 470 330"/>
          <path d="M 470 330 L 530 400"/>
          <path d="M 530 400 L 400 400"/>
        </g>

        <!-- 车座 -->
        <g>
          <path d="M 315 320 L 365 320 L 368 332 L 312 332 Z" fill="#2b2b33"/>
          <path d="M 340 332 L 340 330" stroke="#5a5a66" stroke-width="6"/>
        </g>

        <!-- 车把 -->
        <g stroke="#2b2b33" stroke-width="8" stroke-linecap="round" fill="none">
          <path d="M 470 330 L 500 315"/>
          <path d="M 500 315 q 14 0 18 10"/>
        </g>
        <circle cx="500" cy="315" r="5" fill="#ff9d3f"/>

        <!-- 脚踏 / 曲柄 -->
        <g class="pedals" transform="translate(400, 400)">
          <g stroke="#2b2b33" stroke-width="7" stroke-linecap="round">
            <line x1="0" y1="0" x2="0" y2="-30"/>
            <line x1="0" y1="0" x2="0" y2="30"/>
          </g>
          <rect x="-11" y="-36" width="22" height="8" rx="3" fill="#ff9d3f"/>
          <rect x="-11" y="28" width="22" height="8" rx="3" fill="#ff9d3f"/>
          <circle r="9" fill="#ff9d3f" stroke="#2b2b33" stroke-width="3"/>
        </g>

        <!-- ============ 猫娘角色 ============ -->
        <!-- 双腿（在身体之后绘制，避免被裙子遮住顺序问题；这里放在身体前面，因为腿在前侧） -->
        <!-- 右腿（近侧） -->
        <g stroke="#2b2b33" stroke-width="1.5">
          <path d="M 352 322 Q 366 350 390 372 L 398 428" fill="none" stroke="#ffcfb0" stroke-width="11" stroke-linecap="round"/>
        </g>
        <!-- 右鞋 -->
        <ellipse cx="400" cy="432" rx="14" ry="9" fill="#ff9d3f" stroke="#2b2b33" stroke-width="2"/>
        <!-- 左腿（远侧，稍淡） -->
        <path d="M 336 322 Q 344 344 356 358 L 362 368" fill="none" stroke="#eab69a" stroke-width="11" stroke-linecap="round"/>
        <ellipse cx="363" cy="370" rx="13" ry="8" fill="#e88a2f" stroke="#2b2b33" stroke-width="2"/>

        <!-- 身体 / 连衣裙 -->
        <g>
          <!-- 后背 -->
          <path d="M 320 300 Q 310 250 332 232 L 372 232 Q 396 250 390 300 Q 386 326 352 328 Q 320 326 320 300 Z" fill="#3f9fe8" stroke="#1e6fc0" stroke-width="3"/>
          <!-- 白色水手领 -->
          <path d="M 326 236 L 352 226 L 378 236 L 372 262 L 352 270 L 332 262 Z" fill="#ffffff" stroke="#d7ecff" stroke-width="2"/>
          <!-- 蝴蝶结 -->
          <g transform="translate(352, 238)">
            <path d="M 0 0 L -14 -9 L -14 9 Z" fill="#ff7eb0"/>
            <path d="M 0 0 L 14 -9 L 14 9 Z" fill="#ff7eb0"/>
            <circle r="4" fill="#ff9ebf"/>
          </g>
          <!-- 裙摆 -->
          <path d="M 320 300 Q 322 334 352 338 Q 386 334 390 300 Q 372 330 352 330 Q 334 330 320 300 Z" fill="#3f9fe8" stroke="#1e6fc0" stroke-width="3"/>
          <!-- 手臂（近侧）伸向车把 -->
          <path d="M 372 250 Q 430 268 496 306" fill="none" stroke="#ffcfb0" stroke-width="10" stroke-linecap="round"/>
          <circle cx="500" cy="310" r="7" fill="#ffcfb0" stroke="#2b2b33" stroke-width="1.5"/>
          <!-- 手臂（远侧） -->
          <path d="M 334 248 Q 400 262 486 300" fill="none" stroke="#eab69a" stroke-width="10" stroke-linecap="round"/>
          <circle cx="492" cy="304" r="6" fill="#eab69a" stroke="#2b2b33" stroke-width="1.5"/>
        </g>

        <!-- 头 -->
        <g transform="translate(352, 168)">
          <!-- 双马尾（脑后左右两侧） -->
          <g class="twintail-left">
            <path d="M -40 -8 Q -84 -30 -78 10 Q -74 44 -58 56 Q -42 60 -30 30 Z" fill="url(#hairDark)" stroke="#1e6fc0" stroke-width="3"/>
            <!-- 鲸鱼尾鳍发饰 -->
            <path d="M -78 10 Q -96 4 -104 12 Q -96 22 -78 18 Z" fill="#63bcff" stroke="#1e6fc0" stroke-width="3"/>
          </g>
          <g class="twintail-right">
            <path d="M 40 -8 Q 84 -30 78 10 Q 74 44 58 56 Q 42 60 30 30 Z" fill="url(#hairDark)" stroke="#1e6fc0" stroke-width="3"/>
            <path d="M 78 10 Q 96 4 104 12 Q 96 22 78 18 Z" fill="#63bcff" stroke="#1e6fc0" stroke-width="3"/>
          </g>

          <!-- 后发 -->
          <circle cx="0" cy="0" r="46" fill="url(#hairDark)"/>

          <!-- 猫耳 -->
          <g class="ear-left">
            <path d="M -30 -26 L -26 -58 L -2 -32 Z" fill="#3f9fe8" stroke="#1e6fc0" stroke-width="3" stroke-linejoin="round"/>
            <path d="M -25 -32 L -22 -50 L -8 -34 Z" fill="#ffb6d0"/>
          </g>
          <g class="ear-right">
            <path d="M 30 -26 L 26 -58 L 2 -32 Z" fill="#3f9fe8" stroke="#1e6fc0" stroke-width="3" stroke-linejoin="round"/>
            <path d="M 25 -32 L 22 -50 L 8 -34 Z" fill="#ffb6d0"/>
          </g>

          <!-- 脸 -->
          <circle cx="0" cy="0" r="42" fill="#ffe6d5" stroke="#e8b79a" stroke-width="2"/>

          <!-- 刘海 -->
          <path d="M -42 -2 Q -40 -30 -20 -34 Q -6 -40 2 -34 Q 20 -40 40 -32 Q 42 -12 42 0 Q 30 -14 16 -10 Q 2 -16 -14 -10 Q -30 -14 -42 -2 Z" fill="url(#hair)" stroke="#1e6fc0" stroke-width="2.5"/>

          <!-- 眼睛 -->
          <g class="eye">
            <ellipse cx="-15" cy="4" rx="10" ry="13" fill="#24365f" stroke="#12203f" stroke-width="1.5"/>
            <ellipse cx="15" cy="4" rx="10" ry="13" fill="#24365f" stroke="#12203f" stroke-width="1.5"/>
            <circle cx="-12" cy="0" r="4" fill="#ffffff"/>
            <circle cx="18" cy="0" r="4" fill="#ffffff"/>
            <circle cx="-17" cy="8" r="1.8" fill="#ffffff" opacity="0.85"/>
            <circle cx="13" cy="8" r="1.8" fill="#ffffff" opacity="0.85"/>
            <!-- 睫毛 -->
            <path d="M -25 -2 L -28 -7" stroke="#12203f" stroke-width="2" stroke-linecap="round"/>
            <path d="M 25 -2 L 28 -7" stroke="#12203f" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- 腮红 -->
          <ellipse cx="-26" cy="16" rx="8" ry="5" fill="#ff9eb5" opacity="0.7"/>
          <ellipse cx="26" cy="16" rx="8" ry="5" fill="#ff9eb5" opacity="0.7"/>

          <!-- 嘴 -->
          <path d="M -5 22 Q 0 27 5 22" stroke="#c2685a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>

      </g>
    </svg>
  </div>

  <footer>
    点击画面可以让猫娘加速冲鸭 🐟💨
  </footer>

  <script>
    const stage = document.querySelector('.stage');
    const wheels = document.querySelectorAll('.wheel-rear, .wheel-front, .spokes-rear, .spokes-front, .pedals');
    let fast = false;
    function setSpeed(v) {
      wheels.forEach(el => { el.style.animationDuration = v; });
    }
    stage.addEventListener('click', () => {
      fast = !fast;
      setSpeed(fast ? '0.35s' : '1.2s');
      document.title = fast ? '冲鸭！猫娘！🐟💨' : '大肥鱼猫娘骑自行车 🐟🚲';
    });
  </script>
</body>
</html>
