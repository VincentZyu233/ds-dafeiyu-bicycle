<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鲸鱼女仆娘骑自行车 🐳🚲</title>
<style>
  :root {
    --sky-top: #7ec8ff;
    --sky-bottom: #dff3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }
  header {
    text-align: center;
    padding: 18px 16px 4px;
    position: relative;
    z-index: 2;
  }
  header h1 {
    font-size: clamp(24px, 6vw, 48px);
    color: #fff;
    text-shadow: 0 3px 0 #1e7fd0, 0 6px 14px rgba(0,0,0,0.25);
    letter-spacing: 2px;
  }
  header p {
    margin-top: 6px;
    font-size: clamp(13px, 2.4vw, 17px);
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    opacity: 0.95;
  }
  .stage {
    flex: 1;
    width: 100%;
    max-width: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    position: relative;
    z-index: 1;
  }
  svg { width: 100%; height: auto; max-height: 74vh; }

  /* ---------- 动画 ---------- */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes tailSway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(5deg); }
  }
  @keyframes earWig {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes hairSway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2.5deg); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pedal {
    to { transform: rotate(-360deg); }
  }
  @keyframes cloudMove {
    from { transform: translateX(-160px); }
    to { transform: translateX(1100px); }
  }
  @keyframes rayPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @keyframes bubble {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    20% { opacity: 0.9; }
    100% { transform: translateY(-220px) scale(1.15); opacity: 0; }
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.1); }
  }

  .bike-group { animation: bob 1.6s ease-in-out infinite; }
  .whale-tail { animation: tailSway 1.4s ease-in-out infinite; transform-origin: 300px 300px; }
  .hair-back { animation: hairSway 1.8s ease-in-out infinite; transform-origin: 350px 170px; }
  .ear-left { animation: earWig 1s ease-in-out infinite; transform-origin: 305px 160px; }
  .ear-right { animation: earWig 1s ease-in-out infinite; animation-delay: 0.2s; transform-origin: 395px 160px; }
  .wheel-rear, .wheel-front { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
  .spokes-rear, .spokes-front { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
  .pedals { transform-box: fill-box; transform-origin: center; animation: pedal 1.2s linear infinite; }
  .cloud { animation: cloudMove 28s linear infinite; }
  .cloud.c2 { animation-duration: 40s; animation-delay: -14s; top: 90px; }
  .cloud.c3 { animation-duration: 34s; animation-delay: -26s; top: 150px; }
  .sun-rays { transform-box: fill-box; transform-origin: center; animation: rayPulse 3s ease-in-out infinite; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  .bubble { animation: bubble 3.4s ease-in infinite; }
  .bubble.b2 { animation-delay: 0.9s; }
  .bubble.b3 { animation-delay: 1.7s; }
  .bubble.b4 { animation-delay: 2.5s; }
  footer {
    padding: 8px 14px 14px;
    font-size: 13px;
    color: #1e6fc0;
    position: relative;
    z-index: 2;
    text-align: center;
    font-weight: 600;
  }
</style>
</head>
<body>

  <footer>
    点击画面可以让鲸鱼娘加速冲鸭 🐳💨

  <script>
    const stage = document.querySelector('.stage');
    const wheels = document.querySelectorAll('.wheel-rear, .wheel-front, .spokes-rear, .spokes-front, .pedals');
    let fast = false;
    function setSpeed(v) {
      wheels.forEach(el => { el.style.animationDuration = v; });
    }
    stage.addEventListener('click', () => {
      fast = !fast;
